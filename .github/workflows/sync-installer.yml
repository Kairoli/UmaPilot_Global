name: Sync public installer
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: public-installer
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish the latest full installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-installer.py --publish
